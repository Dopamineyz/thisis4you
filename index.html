<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti 💜</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Parisienne&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Fondo -->

    <div id="background"></div>

    <!-- Partículas -->

    <div id="particles"></div>

    <!-- Sobre -->

    <section id="intro">

        <div id="envelope">

            <div class="lid"></div>

            <div class="letter-preview"></div>

        </div>

        <h1>Tengo algo para ti.</h1>

        <p>
            Espero que esta pequeña carta
            pueda sacarte una sonrisa.
        </p>

        <button id="openButton">

            Abrir carta

        </button>

    </section>

    <!-- Carta -->

    <section id="letterSection">

        <div id="letter">

            <img
                src="assets/lirio.png"
                id="lily"
                alt="Lirio">

            <h2>

                Quería decirte algo...

            </h2>

            <div id="text"></div>

            <button id="finish">

                Gracias por leer 🤍

            </button>

        </div>

    </section>

    <!-- Pétalos -->

    <div id="petals"></div>

    <script src="script.js"></script>

</body>

</html>
